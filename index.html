<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reliance Finance - Official Loan Management Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-blue-900 text-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-building-columns text-2xl text-blue-400"></i>
                <span class="text-xl font-bold tracking-wide">Reliance Finance Portal</span>
            </div>
            <nav class="space-x-4">
                <button onclick="switchPage('home')" class="hover:text-blue-300 font-medium transition"><i class="fa-solid fa-house mr-1"></i> Home</button>
                <button onclick="switchPage('requests')" class="hover:text-blue-300 font-medium transition"><i class="fa-solid fa-list-check mr-1"></i> My Requests</button>
            </nav>
        </div>
    </header>

    <!-- Main Container -->
    <main class="container mx-auto px-4 py-8 flex-grow">
        
        <!-- Home / Payment Request Form Page -->
        <div id="homePage" class="page-section max-w-2xl mx-auto bg-white p-6 md:p-8 rounded-xl shadow-lg border border-slate-100">
            <h2 class="text-2xl font-bold text-blue-900 mb-6 border-b pb-3">Customer Payment Request Form</h2>
            
            <form id="paymentForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-1">Customer Full Name</label>
                    <input type="text" id="custName" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter full name">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-1">Loan Account Number</label>
                    <input type="text" id="loanAcc" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. RL-98765432">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-600 mb-1">Payment Amount (₹)</label>
                        <input type="number" id="payAmount" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. 15000">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-600 mb-1">Payment Mode</label>
                        <select id="payMode" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="UPI">UPI / QR</option>
                            <option value="Net Banking">Net Banking</option>
                            <option value="Debit Card">Debit Card</option>
                            <option value="Bank Transfer (NEFT/RTGS)">NEFT / RTGS</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-1">Remarks / Note</label>
                    <textarea id="payRemarks" rows="3" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Optional notes..."></textarea>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition duration-200 shadow-md">
                    <i class="fa-solid fa-paper-plane mr-2"></i> Submit Payment Request
                </button>
            </form>
        </div>

        <!-- My Requests Page -->
        <div id="requestsPage" class="page-section hidden max-w-4xl mx-auto bg-white p-6 md:p-8 rounded-xl shadow-lg border border-slate-100">
            <div class="flex justify-between items-center mb-6 border-b pb-3">
                <h2 class="text-2xl font-bold text-blue-900">Submitted Payment Requests</h2>
                <button onclick="clearAllRequests()" class="text-sm bg-red-50 text-red-600 hover:bg-red-100 px-3 py-1.5 rounded-lg font-medium transition">
                    <i class="fa-solid fa-trash mr-1"></i> Clear History
                </button>
            </div>
            
            <div id="requestsContainer" class="space-y-4">
                <!-- JavaScript will inject requests here dynamically -->
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 text-slate-400 py-4 text-center text-sm">
        <p>&copy; 2026 Reliance Finance. All rights reserved. Secured GitHub Pages Deployment.</p>
    </footer>

    <!-- JavaScript Logic with LocalStorage Support -->
    <script>
        function switchPage(pageId) {
            document.getElementById('homePage').classList.add('hidden');
            document.getElementById('requestsPage').classList.add('hidden');

            if (pageId === 'home') {
                document.getElementById('homePage').classList.remove('hidden');
            } else if (pageId === 'requests') {
                document.getElementById('requestsPage').classList.remove('hidden');
                loadRequests();
            }
        }

        function handleFormSubmit(event) {
            event.preventDefault();

            const name = document.getElementById('custName').value;
            const account = document.getElementById('loanAcc').value;
            const amount = document.getElementById('payAmount').value;
            const mode = document.getElementById('payMode').value;
            const remarks = document.getElementById('payRemarks').value;

            const newRequest = {
                id: 'REQ-' + Math.floor(100000 + Math.random() * 900000),
                date: new Date().toLocaleString(),
                name,
                account,
                amount,
                mode,
                remarks,
                status: 'Pending Verification'
            };

            let requests = JSON.parse(localStorage.getItem('loan_requests')) || [];
            requests.unshift(newRequest);
            localStorage.setItem('loan_requests', JSON.stringify(requests));

            alert('Payment Request Submitted Successfully!');
            document.getElementById('paymentForm').reset();
            switchPage('requests');
        }

        function loadRequests() {
            const container = document.getElementById('requestsContainer');
            let requests = JSON.parse(localStorage.getItem('loan_requests')) || [];

            if (requests.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-10 text-slate-400">
                        <i class="fa-solid fa-folder-open text-4xl mb-2"></i>
                        <p>No payment requests found yet.</p>
                    </div>`;
                return;
            }

            let html = '';
            requests.forEach(req => {
                html += `
                    <div class="border border-slate-200 rounded-lg p-4 flex flex-col md:flex-row justify-between items-start md:items-center bg-slate-50 gap-4">
                        <div>
                            <div class="flex items-center space-x-2">
                                <span class="font-bold text-blue-900">${req.id}</span>
                                <span class="bg-amber-100 text-amber-700 text-xs px-2 py-0.5 rounded-full font-semibold">${req.status}</span>
                            </div>
                            <h4 class="font-semibold text-slate-700 mt-1">${req.name} <span class="text-xs text-slate-500 font-normal">(Acc: ${req.account})</span></h4>
                            <p class="text-sm text-slate-600 mt-1">Mode: <span class="font-medium">${req.mode}</span> | Remarks: ${req.remarks || 'None'}</p>
                            <span class="text-xs text-slate-400 block mt-1"><i class="fa-regular fa-clock mr-1"></i>${req.date}</span>
                        </div>
                        <div class="text-right w-full md:w-auto">
                            <span class="text-lg font-bold text-emerald-600 block">₹${Number(req.amount).toLocaleString('en-IN')}</span>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function clearAllRequests() {
            if (confirm('Are you sure you want to clear all saved payment requests?')) {
                localStorage.removeItem('loan_requests');
                loadRequests();
            }
        }
    </script>
</body>
</html>
